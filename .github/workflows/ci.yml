name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            cxxflags: ''
            werror: 'ON'
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cxxflags: '-stdlib=libc++'
            werror: 'ON'
          - name: macOS AppleClang
            os: macos-14
            cc: clang
            cxx: clang++
            cxxflags: ''
            werror: 'ON'
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CXXFLAGS: ${{ matrix.cxxflags }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3 zstd
      - name: Install OpenSSL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev libzstd-dev
      - name: Install libc++ for Linux Clang
        if: matrix.name == 'Linux Clang'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libc++-dev libc++abi-dev libssl-dev libzstd-dev
      - name: Configure
        run: cmake --preset debug -DCHRONOS_WARNINGS_AS_ERRORS=${{ matrix.werror }}
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-log-${{ matrix.name }}
          path: build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan and UBSan
            preset: asan-ubsan
          - name: TSan
            preset: tsan
    env:
      CC: clang
      CXX: clang++
      CXXFLAGS: -stdlib=libc++
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install libc++
        run: |
          sudo apt-get update
          sudo apt-get install --yes libc++-dev libc++abi-dev libzstd-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-log-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  format:
    runs-on: ubuntu-24.04
    env:
      CLANG_FORMAT: clang-format-18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install --yes clang-format-18
      - name: Report clang-format version
        run: clang-format-18 --version
      - name: Check formatting
        run: scripts/format.sh --check
      - name: Check workflow action pins
        run: scripts/check-workflow-actions.sh

  clang-tidy:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      CXXFLAGS: -stdlib=libc++
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy libc++-dev libc++abi-dev libssl-dev libzstd-dev
      - name: Configure and run clang-tidy
        run: scripts/lint.sh debug
